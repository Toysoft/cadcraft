[package]
name = "cadcraft-hub"
description = "CADCraft's CraftHub client path: the HubAdapter that maps the drawing database onto craft-collab's generalized object/property model, the unified hub.* command catalog, deep links and presence projections (no networking — the session wiring lands behind the app's `crafthub` feature flag)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
cadcraft-doc = { workspace = true }
# The generalized collaboration core (CraftHub spec §3.4): consumed by git reference exactly as
# the family consumes `craft-print`, pinned to the reviewed commit. Retargeted to the org's
# canonical home (storytold/craft-libs or storytold/crafthub) the day that PR merges — a one-line
# change, noted in this PR's description.
craft-collab = { git = "https://github.com/hasan-sdaif/crafthub", rev = "1e96a9fb9b8c82ac6ec31818608967b66ef7a527" }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# The real constraint solver, for the tolerance tests (§18.4 row 10: concurrent edits to a
# constraint must resolve within tolerance — proven against cadcraft-constraints itself, not a
# stub). Test-only: the adapter never solves; the engine's post-command re-solve hook does.
cadcraft-constraints = { workspace = true }
