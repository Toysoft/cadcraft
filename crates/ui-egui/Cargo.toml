[package]
name = "cadcraft-ui-egui"
description = "CADCraft user interface (egui): the swappable front end"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.95"

[lints]
workspace = true

[dependencies]
craft-ui = { workspace = true }
cadcraft-geom = { workspace = true }
cadcraft-color = { workspace = true }
cadcraft-doc = { workspace = true }
cadcraft-render = { workspace = true }
cadcraft-engine = { workspace = true }
cadcraft-fonts = { workspace = true }
egui = { workspace = true }
# GPU canvas paint callback (same egui-wgpu/wgpu eframe uses with its "wgpu" feature).
egui-wgpu = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
# The Arabic catalog is handed out in visual order (i18n/bidi.rs): a UAX #9 pass for
# egui's run-by-run, left-to-right text layout.
unicode-bidi = "0.3.18"
image = { workspace = true }

# Craft AI's model-runtime bridge: the loopback HTTP client. Native only — the web build draws
# the palette's note instead, and ureq's TLS stack does not build for wasm32.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
# Validates the canvas WGSL and its GLSL ES 3.0 (WebGL2) translation in tests (same naga wgpu uses).
naga = { version = "30", features = ["wgsl-in", "glsl-out"] }

[build-dependencies]
serde_json = { workspace = true }
toml = "1"
